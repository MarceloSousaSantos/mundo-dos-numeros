services:
  - type: web
    name: mundo-dos-numeros
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m gunicorn mundo_numeros.asgi:application -k uvicorn.workers.UvicornWorker
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mundo-numeros-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ENABLE_GEMINI
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        sync: false
      - key: GEMINI_TTS_MODEL
        sync: false
databases:
  - name: mundo-numeros-db
    plan: free
    databaseName: mundo_numeros
    user: mundo_numeros
